<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Battle page wireframe</title>
  <desc id="desc">Neutral wireframe showing navigation, battle introduction, controls, and two card areas.</desc>
  <rect width="900" height="600" fill="#f7f7f7" stroke="#333" stroke-width="4"/>
  <rect x="28" y="24" width="844" height="58" fill="none" stroke="#555" stroke-width="2"/>
  <text x="50" y="60" font-family="sans-serif" font-size="24" fill="#222">NFTPups</text>
  <text x="430" y="60" font-family="sans-serif" font-size="18" fill="#555">Battle   Collection   Store   Profile</text>
  <text x="55" y="145" font-family="sans-serif" font-size="16" fill="#666">BATTLE / 01</text>
