<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFTPups</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
        
        body {
            
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #232526, #414345);
            color: #fff;
            margin: 0;
            padding: 0;
        }
        
        nav {
            background: #111;
            display: flex;
            justify-content: center;
            padding: 1rem;
            gap: 2rem;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ff4081;
        }

        .page {
            display: none;
            padding: 2rem;
            animation: fadeIn 0.5s ease-in-out;
        }

        .page.active {
            display: block;
        }

        .title {
            font-size: 2rem;
            color: #ffcc00;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 2rem;
        }

        .card {
            width: 180px;
            height: 260px;
            perspective: 1000px;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            position: relative;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 90%;
            height: 90%;
            backface-visibility: hidden;
            border-radius: 4%;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .card-front {
            background: #222222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card-front img {
            max-width: 95%;
            border-radius: 2%;
        }

        .card-back {
            background: #333;
            transform: rotateY(180deg);
            padding: 1rem;
            color: #fff;
        }

        .filter-container {
            margin-top: 1rem;
        }

        select {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 0.5rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
#Home,
#collection,
#store,
#settings,
#profile {
    background: #1e1e1e;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
    padding: 2rem;
}
    </style>
</head>

<body>
    <nav>
        <a href="index.html" onclick="switchPage('home')">Home</a>
        <a href="collection.html" onclick="switchPage('collection')">Collection</a>
        <a href="#" onclick="switchPage('store')">Store</a>
        <a href="#" onclick="switchPage('settings')">Settings</a>
        <a href="profile.html" onclick="switchPage('profile')">Profile</a>
    </nav>

    <div id="home" class="page active">
        <h1 class="title">Pup`s Trading Cards</h1>
        <div class="filter-container">
            <label for="filter">Sort by:</label>
            <select id="filter" onchange="filterCards()">
                <option value="all">All</option>
                <option value="speed">Speed</option>
                <option value="style">Style</option>
                <option value="loyalty">Loyalty</option>
                <option value="rarity">Rarity</option>
            </select>
        </div>
        <div class="card-container" id="cardContainer"></div>
    </div>

    <div id="collection" class="page">
        <h1 class="title">My Collection</h1>
        <p>Track your owned cards, favorites, and rare finds.</p>
        <div class="carousel-container">
            <div class="card-carousel" id="collectionContainer"></div>
        </div>
    </div>

    <div id="store" class="page">
        <h1 class="title">Card Store</h1>
        <p>Buy new packs, special editions, and rare hoodie doggos!</p>
    </div>

    <div id="settings" class="page">
        <h1 class="title">Settings</h1>
        <p>Customize your experience. Coming soon!</p>
        <h2>UI Preferences</h2>

        <button class="glow-button">Save Settings</button>

        <div class="toggle-container">
            <span class="toggle-label">Dark Mode</span>
            <label class="toggle-switch">
                <input type="checkbox" id="darkModeToggle" />
                <span class="slider"></span>
            </label>
        </div>
<script>
const switchPage = (pageId) => {
document.querySelectorAll('.page').forEach(page => {
 page.classList.remove('active');
});
 document.getElementById(pageId).classList.add('active');
};

const cards = [
 {
name: "WoodyBlue",
image: "assets/images/WoodyBlue.png",
stats: { speed: 60, style: 80, loyalty: 97, rarity: "Legendary" }
  },
  {
name: "Ace",
image: "assets/images/Ace.png",
stats: { style: 90, loyalty: 60, Speed: 80, rarity: "Epic" }
 },
{
 name: "Darla",
 image: "assets/images/Darla.png",
 stats: { Speed: 90, Style: 80, loyalty: 70, rarity: "Epic" }
 },
  {
 name: "Jinx",
  image: "assets/images/Jinx.png",
 stats: { style: 70, loyalty: 80, rarity: "Epic" }
 },
 {
 name: "Nukie",
 image: "assets/images/Nukie.png",
 stats: { Energy: 80, iq: 90, rarity: "Epic" }
 },
 {
 name: "Nukie",
 image: "assets/images/Nukie.png",
 stats: { Energy: 80, iq: 90, rarity: "Epic" }
 },
 {
 name: "Nukie",
 image: "assets/images/Nukie.png",
 stats: { Energy: 80, iq: 90, rarity: "Epic" }
 },
 {
 name: "Nukie",
 image: "assets/images/Nukie.png",
 stats: { Energy: 80, iq: 90, rarity: "Epic" }
 },
 {
 name: "Nukie",
 image: "assets/images/Nukie.png",
 stats: { Energy: 80, iq: 90, rarity: "Epic" }
 },
 {
 name: "Nukie",
 image: "assets/images/Nukie.png",
 stats: { Energy: 80, iq: 90, rarity: "Epic" }
 },
 {
 name: "Nukie",
 image: "assets/images/Nukie.png",
 stats: { Energy: 80, iq: 90, rarity: "Epic" }
 }
 ];
function renderCards(containerId, cardArray) {
const container = document.getElementById(containerId);
 container.innerHTML = "";
cardArray.forEach(card => {
 const cardDiv = document.createElement('div');
 cardDiv.className = 'card';
 cardDiv.innerHTML = `
          <div class="card-inner">
            <div class="card-front">
              <img src="${card.image}" alt="${card.name}" />
            </div>
            <div class="card-back">
              <h4>Stats</h4>
              <ul>
                <li>Speed: ${card.stats.speed}</li>
                <li>Style: ${card.stats.style}</li>
                <li>Loyalty: ${card.stats.loyalty}</li>
                <li>Rarity: ${card.stats.rarity}</li>
              </ul>
            </div>
          </div>
        `;
cardDiv.addEventListener('click', () => {
cardDiv.classList.toggle('flipped');
 });
container.appendChild(cardDiv);
});
 }
 function filterCards() {
const sortBy = document.getElementById('filter').value;
 if (sortBy === "all") {
 renderCards('cardContainer', cards);
 return;
}
const sorted = [...cards].sort((a, b) => {
if (typeof a.stats[sortBy] === "number") {
 return b.stats[sortBy] - a.stats[sortBy];
 } else {
 return a.stats[sortBy].localeCompare(b.stats[sortBy]);
  }
 });
renderCards('cardContainer', sorted);
 }
renderCards('cardContainer', cards);
renderCards('collectionContainer', cards.slice(0, 2));
</script>
</body>

</html>
