<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NFTPups Profile</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(to right, #232526, #414345);
        color: #fff;
        margin: 0;
        padding: 0;
    }

    nav {
        background: #111;
        display: flex;
        justify-content: center;
        padding: 1rem;
        gap: 2rem;
    }

    nav a {
        color: #fff;
        text-decoration: none;
        transition: color 0.3s;
    }

    nav a:hover {
        color: #ff4081;
    }

    .page {
        display: none;
        padding: 2rem;
        animation: fadeIn 0.5s ease-in-out;
    }

    .page.active {
        display: block;
    }

    .title {
        font-size: 2rem;
        color: #ffcc00;
        text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);
    }

    .card-container {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-top: 0rem;
    }

    .card {
        width: 180px;
        height: 260px;
        perspective: 1000px;
    }

    .card-inner {
        width: 100%;
        height: 100%;
        transition: transform 0.8s;
        transform-style: preserve-3d;
        position: relative;
    }

    .card.flipped .card-inner {
        transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .card-front {
        background: #222;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
    }

    .card-front img {
        max-width: 100%;
        border-radius: 8px;
    }

    .card-front h3 {
        margin-top: 0.5rem;
        color: #ffcc00;
    }

    .card-back {
        background: #333;
        transform: rotateY(180deg);
        padding: 1rem;
        color: #fff;
    }

    .filter-container {
        margin-top: 1rem;
    }

    select {
        background: #333;
        color: #fff;
        border: 1px solid #555;
        padding: 0.5rem;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    #collection,
    #store,
    #settings,
    #profile,
    #home
     {
        background: #1e1e1e;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        padding: 2rem;
    }
</style>
 </head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="collection.html">Collection</a>
    <a href="store.html">Store</a>
    <a href="profile.html" class="active">Profile</a>
    <a href="settings.html">Settings</a>
  </nav>
  <!-- Card Data -->
  <script>
    const cards = [
      {
        name: "LittleLenny",
        image: "assets/images/bolt.png",
        stats: { speed: 8, style: 9, loyalty: 7, rarity: "Epic" }
      },
      {
        name: "Tima",
        image: "images/luna.png",
        stats: { speed: 6, style: 8, loyalty: 10, rarity: "Legendary" }
      },
      {
        name: "Dusty",
        image: "images/pixel.png",
        stats: { speed: 7, style: 7, loyalty: 9, rarity: "Rare" }
      },
      {
        name: "Jasper",
        image: "images/blaze.png",
        stats: { speed: 9, style: 10, loyalty: 6, rarity: "Epic" }
      }
    ];
  </script>

  <script src="assets/js/script.js">
    document.addEventListener('DOMContentLoaded', () => {
      renderCards('collectionCarousel', cards);
    });
  </script>
</body>
</html>
